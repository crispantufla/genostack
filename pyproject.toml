[project]
name = "genostack"
version = "0.1.0"
description = "Local DNA raw-report analyzer: significant genetic findings + deep intervention research via an ACP agent"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.1",
  "httpx>=0.27",
  "rich>=13",
  "pydantic>=2.7",
  "pyyaml>=6",
  "pyarrow>=15",
  "agent-client-protocol>=0.12",
]

[project.scripts]
genostack = "genostack.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["genostack*"]

[tool.setuptools.package-data]
genostack = ["panel/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
