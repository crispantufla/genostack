module: inflammation_gut
title: "Inflamación, inmunidad e intestino"
goals: [health, energy]
description: >
  Variantes comunes que modulan el tono inflamatorio basal (IL-6, IL-1β, TNF, IL-10, CRP),
  la susceptibilidad a enfermedad inflamatoria intestinal, celiaquía y autoinmunidad,
  y la tolerancia a lactosa, histamina y alcohol. Todos los alelos en hebra + GRCh37.

variants:
  - id: IL6_174GC
    gene: IL6
    rsid: rs1800795
    name: "-174G>C (promotor)"
    effect_allele: C
    other_allele: G
    direction: mixed
    genotypes:
      CC: {phenotype: "-174CC: transcripción basal de IL-6 algo menor en reposo, pero respuesta a estímulo y CRP variable según estudio", impact: 1}
      CG: {phenotype: "Heterocigoto -174GC: sin efecto claro", impact: 0}
      GG: {phenotype: "-174GG: genotipo de referencia (casi fijo fuera de Europa)", impact: 0}
    effect_size: "Diferencias de IL-6 circulante pequeñas (<10 %) e inconsistentes entre cohortes"
    evidence: C
    mechanism: "SNP del promotor de IL6 que altera la unión de factores de transcripción; efecto dependiente del contexto inflamatorio"
    levers:
      - "Medir PCR-us e IL-6 si hay síntomas inflamatorios; no actuar sólo por genotipo"
      - "Omega-3 EPA/DHA 2-3 g/d y ejercicio regular reducen IL-6 independientemente del genotipo"
    caveats: "Hebra +: C = -174C, G = -174G. Efecto clínico débil y dirección discutida; tratar como informativo"
    refs: ["PMID:9769329"]

