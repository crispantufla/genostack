module: methylation
title: "Metilación / ciclo de un carbono"
goals: [health, energy, cognition]
description: >
  Variantes que modulan el ciclo folato-metionina (MTHFR, MTRR, MTR, MTHFD1, SHMT1, BHMT, CBS),
  la síntesis de fosfatidilcolina (PEMT), la absorción/transporte de folato y B12 (FOLH1, SLC19A1,
  TCN2, FUT2). Determinan homocisteína, disponibilidad de SAMe y la forma óptima de suplementar
  folato, B12 y colina. Todos los alelos en hebra + de GRCh37 (verificados vía Ensembl/VEP, HGVS).

variants:
  - id: MTHFR_C677T
    gene: MTHFR
    rsid: rs1801133
    name: "C677T (Ala222Val); c.665C>T"
    effect_allele: A
    other_allele: G
    direction: risk
    genotypes:
      AA: {phenotype: "677TT: enzima termolábil, actividad ~30 %; homocisteína ↑ (sobre todo si folato/riboflavina bajos)", impact: 3}
      AG: {phenotype: "677CT: actividad ~65 %; homocisteína ligeramente ↑ con folato bajo", impact: 1}
      GG: {phenotype: "677CC: actividad normal", impact: 0}
    effect_size: "Actividad in vitro ~30 % (TT) / ~65 % (CT); homocisteína +20-25 % en TT con folato bajo; 5-MTHF plasmático ↓"
    evidence: A
    mechanism: "Sustitución Ala222Val en el dominio catalítico: pérdida de FAD, enzima termolábil → menos 5-metil-THF para remetilar homocisteína y generar SAMe"
    levers:
      - "Folato en forma L-metilfolato (5-MTHF) 400-1000 µg/d; evitar megadosis de ácido fólico sintético (ácido fólico no metabolizado)"
      - "Riboflavina (B2) 1.6-5 mg/d: cofactor FAD; en TT con homocisteína alta la reduce ~20-40 % y baja la TA en hipertensos TT"
      - "B12 (metil- o hidroxocobalamina) y B6 suficientes; colina/betaína como vía alternativa de remetilación"
      - "Pedir homocisteína en ayunas, folato eritrocitario, B12/holoTC; objetivo homocisteína <10 µmol/L"
      - "Limitar alcohol (deplecciona folato); verduras de hoja verde a diario"
    caveats: "El efecto depende del estado de folato y B2: con folato adecuado el fenotipo casi desaparece. Alelo T en Ensembl aparece como A (gen en hebra −). No exagerar: TT es ~10 % de europeos y no es una enfermedad."
    refs: ["PMID:7647779", "PMID:9545395"]

  - id: MTHFR_A1298C
    gene: MTHFR
    rsid: rs1801131
    name: "A1298C (Glu429Ala); c.1286A>C"
    effect_allele: G
    other_allele: T
    direction: risk
    genotypes:
      GG: {phenotype: "1298CC: actividad ~60 %; efecto sobre homocisteína pequeño salvo con 677CT (compuesto)", impact: 1}
      GT: {phenotype: "1298AC: actividad ~80-90 %; relevante sólo combinado con 677T", impact: 1}
      TT: {phenotype: "1298AA: normal", impact: 0}
    effect_size: "Actividad ~60 % en CC; homocisteína apenas cambia; heterocigosis compuesta 677CT/1298AC ≈ 677TT leve"
    evidence: B
    mechanism: "Cambio en el dominio regulador C-terminal (unión a SAMe), reduce actividad sin termolabilidad"
    levers:
      - "Si compuesto con 677T: mismas palancas que MTHFR C677T (L-metilfolato, B2, B12)"
      - "Aislado (sin 677T): no requiere intervención específica; dieta rica en folato"
      - "Medir homocisteína sólo si también porta 677T o hay síntomas"
    caveats: "Efecto clínico aislado muy modesto; la mayoría de claims sobre 1298C (BH4, neurotransmisores) no tienen base sólida. Alelo C de la literatura = G en hebra +."
    refs: ["PMID:9545395"]

  - id: MTRR_A66G
    gene: MTRR
    rsid: rs1801394
    name: "A66G (Ile22Met)"
    effect_allele: G
    other_allele: A
    direction: risk
    genotypes:
      GG: {phenotype: "66GG: menor afinidad de MTRR por MTR; homocisteína ligeramente ↑ cuando B12 es baja", impact: 1}
      AG: {phenotype: "Heterocigoto: efecto mínimo", impact: 0}
      AA: {phenotype: "66AA: normal", impact: 0}
    effect_size: "Afinidad por metionina sintasa ~4× menor in vitro; homocisteína +0.5-1 µmol/L en GG con B12 baja; alelo G es el mayoritario en europeos (~55 %)"
    evidence: B
    mechanism: "MTRR reactiva la metionina sintasa (MTR) reduciendo la cob(II)alamina; Ile22Met reduce la eficiencia de esa reactivación"
    levers:
      - "Asegurar B12 óptima (holoTC >50 pmol/L); metil- o hidroxocobalamina 500-1000 µg/d si baja"
      - "Riboflavina: MTRR es una flavoproteína (FAD/FMN)"
      - "Medir homocisteína y ácido metilmalónico si hay 677TT concomitante"
    caveats: "Muy frecuente; efecto pequeño y dependiente de B12. Evidencia de riesgo (DTN, cardiovascular) inconsistente."
    refs: []

