  - id: TCN2_C776G
    gene: TCN2
    rsid: rs1801198
    name: "C776G (Pro259Arg)"
    effect_allele: G
    other_allele: C
    direction: risk
    genotypes:
      GG: {phenotype: "776GG (Arg/Arg): holotranscobalamina ↓ (~10-15 %), homocisteína y MMA ligeramente ↑; menor entrega celular de B12", impact: 2}
      CG: {phenotype: "Heterocigoto: holoTC intermedia", impact: 1}
      CC: {phenotype: "776CC (Pro/Pro): referencia", impact: 0}
    effect_size: "HoloTC −10-15 % y homocisteína +~0.5 µmol/L en GG; GG ~20 % de europeos; mayor riesgo de déficit funcional de B12 con ingesta baja"
    evidence: B
    mechanism: "Transcobalamina II transporta B12 desde la sangre a las células; Arg259 reduce la afinidad/estabilidad del complejo TC-B12"
    levers:
      - "Valorar B12 por holoTC + MMA (la B12 total puede ser normal con déficit funcional)"
      - "Suplementar B12 (hidroxo/metil/adenosilcobalamina 1000 µg/d sublingual o IM) si holoTC <40 pmol/L o MMA alto"
      - "Especial atención en veganos, >60 años, metformina o IBP"
    caveats: "SNP C/G: orientación verificada por HGVS (gen en hebra +: G = Arg). En Ensembl el alelo de referencia es G, pero la proteína 'normal' de la literatura es Pro (C)."
    refs: []

  - id: FUT2_secretor
    gene: FUT2
    rsid: rs601338
    name: "G428A (Trp143Ter; estado secretor/no secretor 'se428')"
    effect_allele: A
    other_allele: G
    direction: mixed
    genotypes:
      AA: {phenotype: "No secretor: B12 sérica ~10 % más alta (menor unión a H. pylori/mayor absorción), microbiota con menos bifidobacterias, resistencia a norovirus GII.4, más riesgo de Crohn/celiaquía", impact: 1}
      AG: {phenotype: "Secretor heterocigoto: B12 intermedia", impact: 0}
      GG: {phenotype: "Secretor: B12 sérica algo más baja; mayor susceptibilidad a H. pylori/norovirus", impact: 1}
    effect_size: "Locus con mayor efecto sobre B12 en GWAS (~0.1 SD por alelo); no secretores ~20 % de europeos"
    evidence: A
    mechanism: "Codón stop en FUT2 → no expresa antígenos ABH en mucosas; modifica la unión de H. pylori (que compite por B12) y la microbiota; posible efecto en absorción ileal"
    levers:
      - "Secretores (GG): vigilar B12/holoTC, sobre todo si dieta baja en proteína animal o IBP; considerar probióticos con Bifidobacterium"
      - "No secretores (AA): B12 sérica puede sobreestimar el estado tisular → usar holoTC/MMA; aporte de fibra prebiótica por menor diversidad de bifidobacterias"
      - "Ambos: test de aliento/serología H. pylori si dispepsia"
    caveats: "El efecto sobre B12 es real pero modesto; el estado secretor tiene más implicaciones inmunes/microbiota que nutricionales."
    refs: ["PMID:18776911", "PMID:19303062"]

