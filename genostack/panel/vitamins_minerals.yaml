      AT: {phenotype: "Portador", impact: 0}
      TT: {phenotype: "Genotipo de referencia", impact: 0}
    effect_size: "Cada alelo A baja ligeramente la 25-OH-D y la DMO de cuello femoral (beta 0.068 DE, p=5e-11)"
    evidence: B
