  - id: VKORC1_1639_nutri
    gene: VKORC1
    rsid: rs9923231
    name: "VKORC1 -1639 G>A (en hebra + C=G clásico, T=A clásico)"
    effect_allele: T
    other_allele: C
    direction: mixed
    genotypes:
      CC: {phenotype: "Expresión alta de VKORC1: reciclado eficiente de vitamina K; dosis de warfarina/acenocumarol estándar-alta", impact: 0}
      CT: {phenotype: "Expresión intermedia: sensibilidad intermedia a anticoagulantes cumarínicos", impact: 1}
      TT: {phenotype: "Expresión baja de VKORC1: reciclado de vitamina K reducido y alta sensibilidad a warfarina/acenocumarol (dosis mucho menores)", impact: 2}
    effect_size: "El haplotipo de baja expresión explica ~25 % de la variabilidad de dosis de warfarina; los homocigotos necesitan aproximadamente la mitad de dosis"
    evidence: A
    mechanism: "VKORC1 regenera la vitamina K hidroquinona necesaria para la gamma-carboxilación (protrombina, osteocalcina, MGP). El SNP del promotor reduce la transcripción"
    levers:
      - "Lectura nutricional: con menos reciclado, mantener un aporte estable de vitamina K1 (verdura de hoja 100-150 g/d) y valorar K2 MK-7 100-200 µg/d, sobre todo si suplementas vitamina D"
      - "Consistencia más que cantidad: evitar oscilaciones bruscas de verdura de hoja"
      - "Si alguna vez te anticoagulan con cumarínicos: este genotipo, con CYP2C9, guía la dosis inicial (ver módulo pharmaco)"
      - "Analítica: INR sólo si estás anticoagulado; osteocalcina infracarboxilada si se investiga estado de vitamina K"
    caveats: "El uso principal de este SNP es farmacogenético; la interpretación nutricional (necesidad de vitamina K) es plausible pero no está probada en ensayos. No modifiques ninguna anticoagulación por tu cuenta."
    refs: ["PMID:15930419"]

