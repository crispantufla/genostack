    name: "BsmI (clásico G>A; en hebra + C=G clásico, T=A clásico)"
    effect_allele: T
    other_allele: C
    direction: risk
    genotypes:
      CC: {phenotype: "Genotipo BB clásico: en meta-análisis, densidad mineral ósea ligeramente mayor", impact: 0}
      CT: {phenotype: "Heterocigoto", impact: 0}
      TT: {phenotype: "Genotipo bb clásico: asociado a densidad mineral ósea algo menor y menor estabilidad del ARNm del VDR", impact: 1}
    effect_size: "Diferencias de DMO entre homocigotos del orden del 1-2 % en meta-análisis; OR de osteoporosis ~0.6-0.9 según genotipo y población"
    evidence: C
    mechanism: "Variante intrónica 3' en fuerte desequilibrio de ligamiento con la región 3'UTR del VDR, que regula la estabilidad del ARNm; no cambia la proteína"
    levers:
      - "Calcio dietético 1000-1200 mg/d (preferir lácteos, sardinas, tofu, almendras) antes que suplementos"
      - "Vitamina D3 según 25-OH-D + K2 MK-7 100-200 µg/d"
      - "Entrenamiento de fuerza e impacto 2-3 veces/semana: la palanca con mayor efecto sobre DMO"
      - "Analítica: 25-OH-D, PTH, calcio, fósforo; densitometría (DEXA) si hay otros factores de riesgo"
    caveats: "Marcador de haplotipo, no funcional; muy correlacionado con TaqI (rs731236). Efecto pequeño."
    refs: []

  - id: VDR_TaqI
