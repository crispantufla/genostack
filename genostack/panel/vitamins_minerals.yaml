module: vitamins_minerals
title: "Vitaminas, minerales y micronutrientes"
goals: [health, energy]
description: >
  Necesidades y manejo de micronutrientes: vitamina D (VDR, GC, CYP2R1, CYP24A1, DHCR7),
  vitamina A a partir de betacaroteno (BCO1), vitamina C (SLC23A1), vitamina K (VKORC1, GGCX),
  vitamina B6 (NBPF3/ALPL), hierro (HFE, TMPRSS6, TF), magnesio (MUC1), selenio (SELENOP),
  omega-3/6 (FADS1/FADS2), colina (CHDH), calcio (CASR) y urato (ABCG2).
  No se duplican aquí: FUT2 (B12) y PEMT/MTHFD1 (colina/folato) están en methylation;
  MCM6/lactasa en inflammation_gut; CYP1A2 en sleep_caffeine; SLC30A8 y FTO en cardiometabolic.
  Todos los alelos están en hebra + de GRCh37 (la orientación del fichero crudo de 23andMe);
  cuando la literatura usa la hebra opuesta se indica en `name` o en `caveats`.

variants:
  - id: VDR_FokI
    gene: VDR
    rsid: rs2228570
    name: "FokI (clásico C>T; en hebra + G=alelo F, A=alelo f)"
    effect_allele: A
    other_allele: G
    direction: risk
    genotypes:
      AA: {phenotype: "ff: se usa el codón de inicio proximal y se produce el VDR largo (427 aa), transcripcionalmente algo menos activo", impact: 1}
      AG: {phenotype: "Ff: intermedio", impact: 1}
      GG: {phenotype: "FF: VDR corto (424 aa), la isoforma más activa; mejor señalización por 1,25(OH)2D", impact: 0}
    effect_size: "La isoforma corta (F) interacciona mejor con TFIIB y tiene ~1.7 veces más actividad transcripcional in vitro; efectos clínicos (DMO, inmunidad) pequeños e inconsistentes"
    evidence: B
    mechanism: "El SNP crea/destruye el primer codón ATG del VDR: el alelo f conserva el ATG upstream (proteína larga) y el alelo F obliga a iniciar en el ATG siguiente (proteína corta, más activa)"
    levers:
      - "Si ff y 25-OH-D bajo: apuntar a la zona alta del rango (35-50 ng/mL) con vitamina D3, no conformarse con 20-30 ng/mL"
      - "Vitamina D3 1000-2000 UI/d de mantenimiento; ajustar por 25-OH-D a las 10-12 semanas"
      - "Acompañar con vitamina K2 MK-7 100-200 µg/d y magnesio 300-400 mg/d (cofactor de las hidroxilasas)"
      - "Analítica: 25-OH-D, calcio, PTH; repetir 2 veces/año (final de invierno y final de verano)"
    caveats: "El genotipo no cambia el objetivo de 25-OH-D en las guías; úsalo para decidir dónde situarte dentro del rango, no para tratar sin analítica. La literatura escribe este SNP como C/T (hebra -)."
    refs: []

  - id: VDR_BsmI
    gene: VDR
