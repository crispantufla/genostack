    refs: []

  - id: GC_rs2282679
    gene: GC
    rsid: rs2282679
    name: "GC (DBP) rs2282679 - principal locus GWAS de 25-OH-D"
    effect_allele: G
    other_allele: T
    direction: risk
    genotypes:
      GG: {phenotype: "Menor proteína transportadora de vitamina D y 25-OH-D total claramente más baja; mayor riesgo de insuficiencia", impact: 2}
      GT: {phenotype: "Portador: 25-OH-D total algo menor", impact: 1}
      TT: {phenotype: "Genotipo de referencia", impact: 0}
    effect_size: "Cada alelo G baja la 25-OH-D total ~1.5-2 ng/mL; es el locus con mayor efecto del GWAS SUNLIGHT (OR de insuficiencia ~1.4-1.5 en homocigotos)"
    evidence: A
    mechanism: "El gen GC codifica la proteína de unión a vitamina D (DBP), que transporta el 85-90 % de la 25-OH-D circulante; menos DBP = menor 25-OH-D total medida"
    levers:
      - "Vitamina D3 titulada por analítica: típicamente 2000-4000 UI/d para portadores con 25-OH-D < 30 ng/mL"
      - "Tomar la D3 con la comida más grasa del día (aumenta la absorción ~30-50 %)"
      - "Magnesio 300-400 mg/d y K2 MK-7 100-200 µg/d como cofactores"
      - "Analítica: 25-OH-D basal y a las 10-12 semanas; PTH y calcio para vigilar la respuesta fisiológica"
    caveats: "Con menos DBP, la 25-OH-D total subestima la fracción libre/biodisponible: no persigas cifras muy altas sólo por el número. Interpretar junto a rs7041 y rs4588 (haplotipos GC1F/GC1S/GC2)."
    refs: ["PMID:20541252"]

  - id: GC_rs7041_D432E
