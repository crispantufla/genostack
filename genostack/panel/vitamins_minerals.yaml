  - id: BCO1_rs12934922
    gene: BCO1
    rsid: rs12934922
    name: "BCMO1/BCO1 R267S"
    effect_allele: T
    other_allele: A
    direction: risk
    genotypes:
      AA: {phenotype: "Arg267/Arg267: conversión de betacaroteno a retinol de referencia", impact: 0}
      AT: {phenotype: "Portador de 267S: conversión algo menor", impact: 1}
      TT: {phenotype: "267S/267S: menor actividad de la BCO1; peor conversión de betacaroteno en vitamina A", impact: 1}
    effect_size: "Junto con A379V (rs7501331) reduce la conversión de betacaroteno hasta un 57-69 % en mujeres voluntarias"
    evidence: B
    mechanism: "BCO1 rompe el betacaroteno en el enterocito para dar retinal; ambas variantes reducen la eficiencia catalítica"
    levers:
      - "Asegurar retinol preformado si eres doble portador: hígado 1 vez/mes, huevos, lácteos enteros, o retinol 1500-3000 UI/d (no superar 3000 µg RAE/d; contraindicado en embarazo a dosis altas)"
      - "No confiar en el betacaroteno de zanahoria/suplementos como única fuente de vitamina A"
      - "Grasa en la misma comida: el betacaroteno necesita 5-10 g de grasa para absorberse"
      - "Analítica: retinol plasmático y betacaroteno sérico (betacaroteno alto con retinol bajo sugiere mala conversión)"
    caveats: "A/T es un par ambiguo. Alelos verificados en hebra + con Ensembl/VEP (A=Arg267, T=Ser267) y la frecuencia de T (~44 % en europeos) coincide con la del alelo 267S descrito; SNPedia también lo lista con orientation=plus."
    refs: ["PMID:19103647"]

