      AA: {phenotype: "C282Y homocigoto: genotipo de hemocromatosis hereditaria tipo 1; riesgo alto de sobrecarga de hierro (ferritina y saturación de transferrina elevadas), con penetrancia clínica parcial (mayor en hombres)", impact: 4}
      AG: {phenotype: "Portador: ferritina y saturación de transferrina algo más altas; riesgo clínico bajo salvo que coexista H63D u otro factor", impact: 1}
      GG: {phenotype: "Sin C282Y", impact: 0}
    effect_size: "Homocigotos C282Y (~0.4 % de europeos del norte): saturación de transferrina >45 % en la mayoría; enfermedad clínica (cirrosis, diabetes, artropatía) en ~10-30 % de hombres y menos en mujeres"
    evidence: A
    mechanism: "HFE regula la producción hepática de hepcidina; C282Y impide el plegamiento y la unión a beta-2-microglobulina, la hepcidina baja y la ferroportina intestinal queda desinhibida: absorción de hierro descontrolada"
    levers:
