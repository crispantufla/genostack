    caveats: "La penetrancia es parcial: muchos homocigotos nunca desarrollan enfermedad, pero todos deben monitorizarse. El heterocigoto simple no tiene, por sí solo, riesgo clínico relevante. La variante S65C (rs1800730) tiene relevancia sólo en combinación con C282Y y se evalúa en la regla de haplotipos HFE."
