      GG: {phenotype: "25-OH-D algo menor: conversión hepática de colecalciferol a 25-OH-D menos eficiente", impact: 1}
    effect_size: "Cada alelo G baja la 25-OH-D ~0.5-1 ng/mL (beta 0.031 unidades, p=2e-46 en GWAS)"
