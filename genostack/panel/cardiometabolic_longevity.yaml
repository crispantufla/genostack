module: cardiometabolic_longevity
title: "Cardiometabolismo y longevidad"
goals: [health, longevity]
description: >
  Variantes con efecto replicado sobre lipoproteínas (Lp(a), LDL, TG, HDL), riesgo coronario,
  glucemia/diabetes tipo 2, adiposidad, hígado graso y loci de longevidad (KLOTHO, FOXO3).
  APOE se evalúa como haplotipo en haplotypes.yaml. Alelos en hebra + GRCh37.

variants:
  - id: LPA_rs10455872
    gene: LPA
    rsid: rs10455872
    name: "Intrón 25 (tag de isoformas KIV-2 cortas, Lp(a) alta)"
    effect_allele: G
    other_allele: A
    direction: risk
    genotypes:
      GG: {phenotype: "Homocigoto: Lp(a) muy alta (típicamente >100-150 nmol/L); riesgo coronario ×2.5 y estenosis aórtica", impact: 4}
      AG: {phenotype: "Portador: Lp(a) ~+50-70 nmol/L (a menudo >50 mg/dL); riesgo coronario ×1.5-1.7 y estenosis aórtica ×2", impact: 3}
      AA: {phenotype: "Referencia (no excluye Lp(a) alta por otros alelos)", impact: 0}
    effect_size: "OR enfermedad coronaria 1.70 por alelo G; explica junto a rs3798220 ~36 % de la varianza de Lp(a) en europeos"
    evidence: A
    mechanism: "Alelo en LD con isoformas apo(a) pequeñas de alta expresión; Lp(a) es causal (aterogénica, protrombótica, proinflamatoria por fosfolípidos oxidados)"
    levers:
      - "Medir Lp(a) en nmol/L una vez en la vida (objetivo <75 nmol/L / <30 mg/dL); ApoB, perfil lipídico, PCR-us"
      - "Si Lp(a) alta: control agresivo de LDL/ApoB (estatina + ezetimiba; PCSK9i reducen Lp(a) ~25 %); aspirina 100 mg en prevención primaria si Lp(a) alta (ASPREE subanálisis)"
      - "Niacina baja Lp(a) 20-30 % pero sin beneficio CV demostrado; aféresis en casos extremos"
      - "Fármacos específicos en fase 3: pelacarsen (ASO), olpasiran, lepodisiran, zerlasiran (siRNA) — Lp(a) -80-95 %; muvalaplin oral"
      - "Ecocardiograma/TC coronario (calcio) a partir de 40-45 años; evitar tabaco"
    caveats: "Lp(a) genética no cambia con dieta; un resultado AA no descarta Lp(a) alta (medir siempre)"
    refs: ["PMID:20032323"]

