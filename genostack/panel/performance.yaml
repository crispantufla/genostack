module: performance
title: "Rendimiento físico, composición corporal y tejido conectivo"
goals: [performance, health]
description: >
  Perfil potencia/resistencia (ACTN3, ACE, HIF1A, CKM, MCT1), respuesta cardiovascular y
  vasodilatación (NOS3, AGT, ADRB2/ADRB3), masa magra (TRHR, MSTN, CNTF) y riesgo de lesión de
  tejido conectivo (COL1A1, COL5A1, MMP3, GDF5). Ninguna de estas variantes decide un techo de
  rendimiento: el entrenamiento, el sueño y la nutrición pesan mucho más; se usan para afinar
  el tipo de estímulo, la recuperación y la prevención de lesiones.
  No se duplican aquí: PPARGC1A, AMPD1 y PPARA están en energy_mito; VDR en vitamins_minerals;
  IL6 -174 (rs1800795) en inflammation_gut; FTO en cardiometabolic. El indel ACE I/D real
  (rs1799752) y BDKRB2 +9/-9 no son tipables por array: se usa un tag SNP.
  Todos los alelos están en hebra + de GRCh37 (la orientación del fichero crudo de 23andMe).

variants:
  - id: ACTN3_R577X
    gene: ACTN3
    rsid: rs1815739
    name: "R577X (clásico C1747T)"
    effect_allele: T
    other_allele: C
    direction: mixed
    genotypes:
      CC: {phenotype: "RR: alfa-actinina-3 presente en fibras rápidas tipo II; perfil de potencia/velocidad favorecido, algo más de daño muscular excéntrico", impact: 1}
      CT: {phenotype: "RX: fenotipo intermedio, el más común", impact: 0}
      TT: {phenotype: "XX (~18 % de europeos): ausencia total de alfa-actinina-3; menor potencia máxima y velocidad, mejor eficiencia y perfil de resistencia; recuperación algo más rápida del daño muscular", impact: 2}
    effect_size: "El genotipo XX está claramente infrarrepresentado en velocistas de élite (y algo sobrerrepresentado en fondistas); en población general la diferencia de potencia entre genotipos es del orden del 2-5 %"
    evidence: A
    mechanism: "El codón de parada prematuro elimina la alfa-actinina-3 de la línea Z de las fibras tipo II; la alfa-actinina-2 compensa parcialmente, desplazando el metabolismo hacia un perfil más oxidativo"
    levers:
      - "Si XX: prioriza volumen y trabajo de resistencia/fuerza-resistencia; para ganar potencia necesitarás más trabajo específico de fuerza máxima y pliometría (respondes, pero desde más atrás)"
      - "Si XX: la creatina monohidrato 3-5 g/d es especialmente útil para compensar el déficit de potencia"
      - "Si RR: mayor daño muscular excéntrico: cuidar la progresión de bajadas/pliometría y la recuperación (proteína 1.6-2.2 g/kg/d, sueño 7-9 h)"
      - "Test práctico: salto vertical / sprint 30 m vs test de umbral: el fenotipo real manda sobre el genotipo"
    caveats: "Es el SNP de rendimiento mejor replicado, pero explica una fracción pequeña de la varianza: no descarta ni garantiza nada a nivel individual."
    refs: ["PMID:12879365"]

  - id: ACE_rs4343_ID_tag
    gene: ACE
    rsid: rs4343
    name: "Tag del polimorfismo I/D de ACE (A = alelo I, G = alelo D)"
    effect_allele: G
    other_allele: A
    direction: mixed
    genotypes:
      AA: {phenotype: "Equivalente a I/I: ECA sérica más baja; perfil asociado a resistencia aeróbica y mayor eficiencia muscular", impact: 1}
      AG: {phenotype: "Equivalente a I/D: intermedio", impact: 0}
      GG: {phenotype: "Equivalente a D/D: ECA sérica más alta (hasta el doble que I/I); perfil asociado a fuerza/potencia y a mayor hipertrofia ventricular con el entrenamiento", impact: 1}
    effect_size: "El genotipo explica ~40-50 % de la variabilidad de la ECA sérica; las asociaciones con rendimiento (resistencia en I/I, potencia en D/D) son reales pero de efecto pequeño e inconsistente entre deportes"
    evidence: B
    mechanism: "La inserción/deleción de un elemento Alu en el intrón 16 de ACE determina la concentración de enzima convertidora de angiotensina; más ECA = más angiotensina II (vasoconstricción, hipertrofia) y menos bradicinina"
    levers:
      - "Si GG (D/D): vigilar tensión arterial en cada revisión y el remodelado cardiaco si haces mucho entrenamiento de fuerza; sodio moderado (<5 g de sal/d)"
      - "Si AA (I/I): buen sustrato para trabajo de umbral y volumen aeróbico"
      - "Palanca general: entrenamiento de resistencia y control del sodio afectan más a la tensión que el genotipo"
      - "Analítica/medición: tensión arterial domiciliaria; ECG/ecocardio si hay hipertrofia sospechada"
    caveats: "IMPORTANTE: rs4343 es un tag, no el indel. La correspondencia con I/D es alta (r2 ~0.9) pero no perfecta, así que el genotipo I/D inferido puede fallar en una minoría de casos. El indel real (rs1799752) no se puede leer en un array. rs4341 es un tag alternativo, pero es C/G (par ambiguo) y por eso se prefiere rs4343 (A/G)."
    refs: []

  - id: COL1A1_Sp1
