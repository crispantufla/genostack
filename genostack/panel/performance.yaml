      AA: {phenotype: "ss (~3 %): más transcripción de la cadena alfa1, colágeno con proporción alterada; densidad mineral ósea menor y más riesgo de fractura osteoporótica, pero tendón/ligamento aparentemente más resistentes a la rotura", impact: 2}
