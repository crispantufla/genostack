module: neuro
title: "Neurotransmisión, cognición y productividad"
goals: [cognition, health]
description: >
  Variantes en enzimas de degradación de catecolaminas (COMT, MAOA/B, DBH), receptores y transportadores
  de dopamina, serotonina, GABA, acetilcolina y endocannabinoides, y factores de plasticidad (BDNF, KIBRA).
  Modulan memoria de trabajo, tolerancia al estrés, respuesta a estimulantes/nootrópicos y ansiedad.
  La mayoría son efectos pequeños (impact 1); sólo COMT, BDNF, MAOA, DRD2/ANKK1, FAAH, DBH, OPRM1 y KIBRA
  alcanzan impact 2 en homocigotos. Todos los alelos en hebra + de GRCh37 (verificados vía Ensembl/VEP).

variants:
  - id: COMT_V158M
    gene: COMT
    rsid: rs4680
    name: "Val158Met (c.472G>A)"
    effect_allele: A
    other_allele: G
    direction: mixed
    genotypes:
      AA: {phenotype: "Met/Met ('worrier'): COMT ~25-40 % de actividad → más dopamina prefrontal tónica; mejor memoria de trabajo basal, peor rendimiento bajo estrés, más sensibilidad al dolor y a estimulantes/cafeína, ansiedad ↑", impact: 2}
      AG: {phenotype: "Val/Met: actividad intermedia; fenotipo intermedio y más flexible", impact: 1}
      GG: {phenotype: "Val/Val ('warrior'): COMT rápida → menos dopamina prefrontal; rinde mejor bajo estrés/dolor, peor en tareas de memoria de trabajo; más beneficio cognitivo de estimulantes y de inhibidores de COMT", impact: 2}
    effect_size: "Actividad enzimática 3-4× menor en Met/Met; efecto sobre cognición d≈0.1-0.2 (meta-análisis, pequeño); efecto robusto sobre dolor/opioides y respuesta a tolcapona/anfetamina"
    evidence: A
    mechanism: "Met hace la enzima termolábil; COMT es la vía principal de aclaramiento de dopamina en corteza prefrontal (pocos DAT), por lo que modula la curva U-invertida dopamina-rendimiento"
    levers:
      - "Met/Met: evitar sobrecarga de donantes de metilo (SAMe, metilfolato/metil-B12 altos pueden aumentar irritabilidad); magnesio, L-teanina 200 mg, ejercicio aeróbico; cafeína moderada; no añadir tirosina sin necesidad"
      - "Met/Met: estimulantes (metilfenidato/anfetamina) y cafeína con más efectos adversos; para foco preferir L-teanina+cafeína baja dosis, mindfulness; estradiol inhibe COMT (mujeres Met/Met: más sintomáticas en fase folicular)"
      - "Val/Val: L-tirosina 500-2000 mg antes de tareas exigentes bajo estrés/privación de sueño; mayor respuesta cognitiva a estimulantes; el té verde (EGCG) inhibe COMT levemente; tolcapona experimental (hepatotóxico, no recomendable)"
      - "Val/Val: tolera mejor metilfolato/SAMe; puede beneficiarse de más cafeína/ejercicio intenso"
      - "Ambos: el genotipo COMT condiciona interpretación de MAOA, DBH y DRD2 (ver combinaciones)"
    caveats: "Efectos cognitivos pequeños y dependientes de contexto (estrés, sexo, edad, carga de la tarea); no tipificar personalidad por un SNP. Interactúa con rs4818/rs4633 (haplotipos de expresión)."
    refs: ["PMID:8807664", "PMID:11381111", "PMID:15048648"]

  - id: MAOA_R297R
