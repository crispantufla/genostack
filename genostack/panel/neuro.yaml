      - "Alta actividad (G): si ánimo bajo, valorar 5-HTP/triptófano o rhodiola (inhibidor MAO-A suave); B6/P5P; luz de mañana"
      - "Ambos: los efectos dependen mucho del entorno (estrés crónico) → priorizar sueño y exposición social"
    caveats: "Gen ligado al X: varones tienen un solo alelo (clave de una letra; 23andMe puede mostrarlo como doble letra). El marcador clásico es el uVNTR, no genotipado por chips; rs6323 es un proxy imperfecto. Orientación plus confirmada en SNPedia."
    refs: []

