    name: "T941G (Arg297Arg, EcoRV); G = alta actividad, T = baja actividad"
    effect_allele: T
    other_allele: G
    direction: mixed
    genotypes:
      T: {phenotype: "Varón hemicigoto T: MAO-A de baja actividad → degradación más lenta de serotonina, noradrenalina y dopamina; más reactividad emocional/agresividad bajo estrés en algunos estudios, mayor sensibilidad a tiramina y a inhibidores de MAO", impact: 2}
      G: {phenotype: "Varón hemicigoto G: MAO-A de alta actividad; niveles monoaminérgicos más bajos; menor respuesta placebo y posible mayor riesgo de depresión en algunas cohortes", impact: 1}
      TT: {phenotype: "Mujer TT: baja actividad MAO-A (ambos alelos)", impact: 2}
      GT: {phenotype: "Mujer GT: actividad intermedia (inactivación X aleatoria → mosaico)", impact: 0}
      GG: {phenotype: "Mujer GG: alta actividad MAO-A", impact: 1}
    effect_size: "Diferencia de actividad plaquetaria/fibroblastos ~1.5-2× entre alelos; marcador parcial del uVNTR (MAOA-L/H); efectos conductuales pequeños y dependientes de ambiente (maltrato infantil)"
    evidence: B
    mechanism: "Variante sinónima del exón 8 en LD con el uVNTR promotor; el alelo G se asocia a mayor expresión/actividad de MAO-A"
    levers:
      - "Baja actividad (T): cuidado con suplementos/fármacos que elevan serotonina (5-HTP, triptófano, SAMe, hierba de San Juan, ISRS juntos) y con tiramina si usa IMAO; riboflavina (MAO es FAD-dependiente); ejercicio y regulación del estrés"
