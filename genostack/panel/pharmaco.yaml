module: pharmaco
title: "Farmacogenómica"
goals: [pharmaco, health]
description: >
  Variantes individuales con impacto sobre dosis, eficacia o toxicidad de fármacos de uso común
  (anticoagulantes, estatinas, antidepresivos, opioides, IBP, inmunosupresores, quimioterápicos,
  antibióticos, anestésicos). Los fenotipos metabolizadores (CYP2C19, CYP2C9, CYP2D6, SLCO1B1, DPYD,
  TPMT, NAT2) se calculan como diplotipo en haplotypes.yaml; aquí cada SNP lleva impacto propio moderado.
  CYP1A2*1F (rs762551) está en sleep_caffeine; ABCG2 rs2231142 (urato) en vitamins — también reduce el
  aclaramiento de rosuvastatina/alopurinol (dosis máxima 20 mg rosuvastatina si homocigoto). Alelos en hebra + GRCh37.

variants:
  - id: VKORC1_1639GA
    gene: VKORC1
    rsid: rs9923231
    name: "-1639G>A (T en hebra + = A, alelo de sensibilidad a warfarina)"
    effect_allele: T
    other_allele: C
    direction: risk
    genotypes:
      TT: {phenotype: "-1639AA: alta sensibilidad a warfarina/acenocumarol — dosis ~50 % de la estándar; mayor riesgo de INR supraterapéutico al inicio", impact: 3}
      CT: {phenotype: "-1639GA: sensibilidad intermedia — dosis ~25-30 % menor", impact: 2}
      CC: {phenotype: "-1639GG: sensibilidad normal (dosis estándar o mayor)", impact: 0}
    effect_size: "Explica ~25-30 % de la varianza de dosis de warfarina; dosis media GG 6-7 mg/d, GA 4-5, AA 3"
    evidence: A
    mechanism: "Menor expresión hepática de VKORC1 (diana de cumarínicos) → menos enzima que inhibir"
    levers:
      - "Si se inicia warfarina/acenocumarol: algoritmo de dosis con genotipo (warfarindosing.org; CPIC) combinando VKORC1 + CYP2C9 + CYP4F2; INR más frecuente las primeras 2 semanas"
      - "Alternativa: anticoagulantes directos (apixabán, rivaroxabán) no dependen de VKORC1"
      - "Vitamina K dietética estable; informar al médico del genotipo"
    caveats: "VKORC1 en hebra −: T (hebra +) = -1639A. Acenocumarol y fenprocumón se comportan igual"
    refs: ["PMID:15930419", "PMID:28198005"]

