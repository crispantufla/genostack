module: energy_mito
title: "Energía, mitocondria, estrés oxidativo y detoxificación fase I/II"
goals: [energy, longevity, health]
description: >
  Biogénesis mitocondrial (PPARGC1A, PPARD, PPARA), defensa antioxidante endógena
  (NFE2L2/NRF2, SOD2, GPX1, CAT, NQO1, GCLC), conjugación y detoxificación de xenobióticos
  (GSTP1, NAT2, CYP1B1, PON1) y desacoplamiento/energía muscular (UCP2, UCP3, AMPD1).
  Aviso: las deleciones GSTM1-null y GSTT1-null (las más relevantes de la familia GST) son
  variantes de número de copia y NO son detectables en un array de 23andMe/Ancestry: no
  aparecen en este panel aunque se citen mucho en la literatura de detox. HMOX1 (repeat GT)
  tampoco es tipable por array. rs671 (ALDH2) se evalúa en inflammation_gut y KL-VS en
  cardiometabolic_longevity; el fenotipo acetilador NAT2 completo se resuelve en pharmaco.
  Todos los alelos están en hebra + de GRCh37 (la orientación del fichero crudo de 23andMe).

variants:
  - id: PPARGC1A_Gly482Ser
    gene: PPARGC1A
    rsid: rs8192678
    name: "Gly482Ser (clásico G1444A / 'A' en hebra -)"
    effect_allele: T
    other_allele: C
    direction: risk
    genotypes:
      CC: {phenotype: "Gly/Gly: PGC-1alfa de referencia; mejor respuesta media de biogénesis mitocondrial al ejercicio", impact: 0}
      CT: {phenotype: "Gly/Ser: fenotipo intermedio", impact: 1}
      TT: {phenotype: "Ser/Ser: menor actividad transcripcional de PGC-1alfa; VO2max basal y respuesta al entrenamiento algo menores, riesgo de DM2 ligeramente aumentado", impact: 2}
    effect_size: "Meta-análisis: OR DM2 ~1.1-1.2 por alelo Ser; diferencias de VO2max entre genotipos pequeñas (<5 %) y muy dependientes del entrenamiento"
    evidence: B
    mechanism: "PGC-1alfa es el coactivador maestro de la biogénesis mitocondrial (NRF1/NRF2-GABPA, TFAM, ERRalfa). La sustitución Gly482Ser reduce la actividad coactivadora y la inducción de genes OXPHOS"
    levers:
      - "Palanca dominante: entrenamiento de resistencia (zona 2, 150-240 min/sem) + 1-2 sesiones HIIT 4x4 min: sobreexpresa PGC-1alfa por encima del efecto del genotipo"
      - "Urolitina A 500-1000 mg/d: mejora fuerza muscular y biomarcadores mitocondriales en RCT (mitofagia, vía independiente de PGC-1alfa)"
      - "Precursores de NAD+: nicotinamida ribósido 250-500 mg/d o NMN 250-500 mg/d (efecto sobre función mitocondrial modesto y heterogéneo en humanos)"
      - "Exposición al frío y ayuno intermitente: activan PGC-1alfa vía AMPK/SIRT1"
      - "Analítica: VO2max o test de lactato, HbA1c y glucosa/insulina en ayunas (HOMA-IR)"
    caveats: "El efecto sobre rendimiento es pequeño frente al del entrenamiento; el alelo Ser es muy frecuente (~34 % en europeos). No duplicado en el módulo performance."
    refs: ["PMID:16435105"]

  - id: NFE2L2_prom_617
    gene: NFE2L2
    rsid: rs6721961
    name: "Promotor -617 C>A (hebra -); T = alelo -617A clásico"
    effect_allele: T
    other_allele: G
    direction: risk
    genotypes:
      GG: {phenotype: "Actividad basal normal del promotor NRF2", impact: 0}
      GT: {phenotype: "Portador: inducción de genes ARE algo menor bajo estrés oxidativo", impact: 1}
      TT: {phenotype: "Homocigoto: menor transcripción de NRF2 y menor inducción de HMOX1/NQO1/GCLC; peor tolerancia al estrés oxidativo (tabaco, contaminación, ejercicio extenuante)", impact: 2}
    effect_size: "Reducción de la actividad del promotor NRF2 in vitro; asociación con lesión pulmonar aguda y peor respuesta antioxidante en fumadores. Alelo T ~12 % en europeos"
    evidence: C
    mechanism: "El SNP cae en un elemento ARE del propio promotor de NFE2L2 y reduce su autoinducción; NRF2 gobierna la expresión de NQO1, HMOX1, GCLC/GCLM, GST y tiorredoxina"
    levers:
      - "Sulforafano 10-20 mg/d (glucorafanina 30-60 mg + mirosinasa activa) o 50-100 g/d de germinados de brócoli: el inductor de NRF2 mejor documentado en humanos"
      - "Ejercicio aeróbico regular: inductor fisiológico de NRF2 (hormesis)"
      - "Evitar tabaco y humos; filtro HEPA si hay alta contaminación"
      - "Alternativas/coadyuvantes: curcumina fitosomada 500-1000 mg/d, EGCG del té verde, resveratrol (evidencia menor)"
      - "Evitar megadosis crónicas de antioxidantes aislados (vit C/E > 1 g/400 UI) que embotan la señal hormética del ejercicio"
    caveats: "Evidencia mayoritariamente in vitro y en cohortes pequeñas; el efecto clínico individual es incierto. rs6721961 (G/T) no es un SNP ambiguo, la orientación está verificada en Ensembl y SNPedia (orientation=plus)."
    refs: []

