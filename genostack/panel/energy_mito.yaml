  - id: SOD2_Ala16Val
    gene: SOD2
    rsid: rs4880
    name: "Ala16Val (clásico C47T; C=Ala en cDNA = G en hebra +)"
    effect_allele: A
    other_allele: G
    direction: mixed
    genotypes:
      AA: {phenotype: "Val/Val: menor eficiencia de importación de SOD2 a la matriz mitocondrial (~30-40 % menos actividad mitocondrial); más superóxido mitocondrial", impact: 1}
      AG: {phenotype: "Ala/Val: intermedio", impact: 0}
      GG: {phenotype: "Ala/Ala: importación eficiente y más SOD2 mitocondrial; genera más H2O2, que hay que aclarar con GPX1/catalasa (mirar GPX1 rs1050450 y CAT rs1001179)", impact: 1}
    effect_size: "La hélice alfa Ala16 se importa ~30-40 % mejor a la mitocondria (estudio funcional); asociaciones clínicas (cáncer, fertilidad, diabetes) inconsistentes"
    evidence: B
    mechanism: "El polimorfismo está en la secuencia señal mitocondrial: Ala favorece la hélice alfa y el paso por el poro TIM/TOM; Val la desestabiliza y deja parte de la proteína en el citosol"
    levers:
      - "Manganeso suficiente pero no alto: 2-5 mg/d de la dieta (frutos secos, legumbres, cereal integral, té); evitar suplementos de Mn > 10 mg/d y agua con Mn elevado"
      - "Si Ala/Ala: asegurar el brazo distal (selenio 100-150 µg/d hasta selenio plasmático 100-130 µg/L, y buena función de catalasa) para no acumular H2O2"
      - "Si Val/Val: prioriza reducir carga oxidativa mitocondrial (evitar sobreentrenamiento, alcohol, exceso de hierro libre)"
      - "Analítica opcional: 8-OHdG o isoprostanos F2 en orina (interpretación limitada)"
    caveats: "La literatura usa C/T (cDNA, hebra -). En el fichero de 23andMe verás A/G: A = Val, G = Ala. Muchas webs de 'nutrigenética' invierten este SNP."
    refs: ["PMID:12618592"]

