    effect_allele: T
    other_allele: C
    direction: mixed
    genotypes:
      TT: {phenotype: "Asn/Asn (muy raro): actividad de adenosina desaminasa muy reducida → más adenosina; sueño más profundo y mayor somnolencia diurna", impact: 2}
      CT: {phenotype: "Asp/Asn (~8-10 %): actividad ADA −20-30 %; más sueño de ondas lentas (+~30 min de SWS/ delta EEG), menor vigilancia en privación de sueño, mayor sensibilidad a la cafeína", impact: 2}
      CC: {phenotype: "Asp/Asp: referencia", impact: 0}
    effect_size: "Portadores A: SWS +25-30 %, potencia delta ↑, peor atención sostenida tras 40 h de vigilia (Rétey 2005; Bachmann 2012)"
    evidence: B
    mechanism: "Menor degradación de adenosina → mayor presión homeostática de sueño (proceso S) y mayor intensidad del sueño profundo"
    levers:
      - "Portadores T: respetan mejor 7.5-8.5 h de sueño (toleran peor la privación); siestas cortas eficaces; evitar cafeína por la tarde (más efecto)"
