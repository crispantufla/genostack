module: sleep_caffeine
title: "Sueño, cronotipo y cafeína"
goals: [energy, cognition, health]
description: >
  Metabolismo de la cafeína (CYP1A2, AHR), sensibilidad a adenosina (ADORA2A, ADA), genes reloj y
  cronotipo (CLOCK, PER2, PER3, RGS16, CRY1, BHLHE41/DEC2), melatonina-glucosa (MTNR1B) e insomnio/
  piernas inquietas (MEIS1). Permite ajustar horarios de cafeína, luz, cena y sueño al genotipo.
  Todos los alelos en hebra + de GRCh37 (verificados vía Ensembl/VEP y GWAS Catalog).

variants:
  - id: CYP1A2_163CA
    gene: CYP1A2
    rsid: rs762551
    name: "CYP1A2*1F −163C>A (intrón 1)"
    effect_allele: C
    other_allele: A
    direction: risk
    genotypes:
      CC: {phenotype: "Metabolizador lento de cafeína (~10 %): enzima poco inducible; vida media de cafeína más larga; café >2-3 tazas/d asociado a más riesgo de infarto/hipertensión y peor rendimiento deportivo con cafeína en algunos estudios", impact: 2}
      AC: {phenotype: "Metabolizador intermedio (~45 %): inducibilidad reducida; cafeína de tarde afecta más al sueño", impact: 1}
      AA: {phenotype: "Metabolizador rápido (*1F/*1F, ~45 %): alta inducibilidad (más en fumadores); cafeína se elimina más rápido; mayor beneficio ergogénico", impact: 0}
    effect_size: "Diferencia de aclaramiento ~1.5-2× entre AA y CC en fumadores/inducidos (mucho menor sin inducción); OR infarto ~1.4-2 en portadores C con ≥3 tazas/d (Cornelis 2006)"
    evidence: B
    mechanism: "Variante intrónica que reduce la inducibilidad de CYP1A2, enzima que metaboliza >90 % de la cafeína (y clozapina, olanzapina, melatonina)"
    levers:
      - "C (lento): cafeína ≤200 mg/d y última toma ≥8-10 h antes de acostarse; evitar >2 tazas/d si hipertensión; considerar descafeinado/té verde por la tarde"
      - "C (lento): ojo con interacciones: fluvoxamina, ciprofloxacino y anticonceptivos orales inhiben CYP1A2 (cafeína dura aún más); tabaco y crucíferas la inducen"
      - "A (rápido): cafeína 3-6 mg/kg pre-entreno tiene más efecto ergogénico; aun así cortar 6-8 h antes de dormir"
      - "Ambos: la melatonina exógena también se metaboliza por CYP1A2 → lentos pueden necesitar dosis más bajas (0.3-0.5 mg)"
    caveats: "El efecto de −163C>A sobre la farmacocinética basal es modesto; el genotipo explica sólo parte de la variabilidad. Sensibilidad subjetiva depende también de ADORA2A."
    refs: ["PMID:10233211", "PMID:16522833"]

