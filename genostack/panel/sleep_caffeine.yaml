  - id: ADORA2A_1083TC
    gene: ADORA2A
    rsid: rs5751876
    name: "1083T>C / 1976C>T (Tyr361Tyr)"
    effect_allele: T
    other_allele: C
    direction: mixed
    genotypes:
      TT: {phenotype: "TT (~20 %): más ansiedad, palpitaciones y nerviosismo tras 150 mg de cafeína (dos estudios controlados); más insomnio inducido por cafeína según algunos; tienden a consumir menos cafeína", impact: 2}
      CT: {phenotype: "CT: sensibilidad intermedia", impact: 1}
      CC: {phenotype: "CC: menos ansiedad con cafeína; en un estudio (Rétey 2007) los CC se autodescribían como más sensibles al efecto de la cafeína sobre el sueño y mostraron mayor efecto EEG", impact: 1}
    effect_size: "Ansiedad tras cafeína: diferencia ~0.5 SD TT vs resto (Alsene 2003; Childs 2008); asociación con insomnio por cafeína replicada parcialmente"
    evidence: B
    mechanism: "Variante sinónima del receptor de adenosina A2A (diana de la cafeína) en LD con variantes reguladoras de expresión; modula la respuesta ansiogénica/alertante a la cafeína"
    levers:
      - "TT: cafeína ≤100-150 mg por toma, nunca en ayunas ni con estrés agudo; L-teanina 200 mg junto a la cafeína reduce la ansiedad; evitar pre-entrenos cargados"
      - "TT: si ansiedad basal, valorar descafeinado/matcha; magnesio"
      - "CC: tolera mejor la cafeína como ergogénico, pero vigilar efecto sobre latencia/profundidad de sueño (cortar ≥8 h antes)"
      - "Todos: en privación de sueño, la cafeína no sustituye el déficit de sueño profundo (ADA/ADORA2A modulan la presión homeostática)"
    caveats: "Efecto sobre ansiedad bien replicado; efecto sobre sueño discutido (direccionalidad variable entre estudios). Orientación plus confirmada en SNPedia."
    refs: ["PMID:12825092", "PMID:18305461"]

  - id: ADA_G22A
    gene: ADA
    rsid: rs73598374
