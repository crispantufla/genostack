  - id: AHR_rs4410790
    gene: AHR
    rsid: rs4410790
    name: "AHR (T/C); proxy de rs6968865"
    effect_allele: T
    other_allele: C
    direction: mixed
    genotypes:
      TT: {phenotype: "TT: menor inducción de CYP1A2 vía receptor de hidrocarburos aromáticos → niveles de cafeína más altos por dosis y menor consumo habitual de café (−0.1-0.15 tazas/d por alelo)", impact: 1}
      CT: {phenotype: "CT: intermedio", impact: 0}
      CC: {phenotype: "CC: mayor inducción de CYP1A2; aclaramiento más rápido y mayor consumo de café", impact: 1}
